<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1">
        <animate attributeName="stop-color" values="#0a0e27;#1a1a3e;#0a0e27" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#1a1f4d;stop-opacity:1">
        <animate attributeName="stop-color" values="#1a1f4d;#2d2d5e;#1a1f4d" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0f0f2e;stop-opacity:1">
        <animate attributeName="stop-color" values="#0f0f2e;#252544;#0f0f2e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Terminal gradient -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0.98" />
    </linearGradient>
    
    <!-- Intense glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Super glow for cursor -->
    <filter id="superGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.6"/>
    </filter>
    
    <!-- Radial gradient for spotlight -->
    <radialGradient id="spotlight">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0" />
    </radialGradient>
    
    <!-- Matrix rain gradient -->
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00ff41;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background with animated gradient -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Floating particles -->
  <circle cx="120" cy="150" r="2" fill="#00ff41" opacity="0.4">
    <animate attributeName="cy" values="150;180;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="250" r="2" fill="#82aaff" opacity="0.4">
    <animate attributeName="cy" values="250;220;250" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="180" r="2" fill="#ff6b9d" opacity="0.4">
    <animate attributeName="cy" values="180;200;180" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Spotlight effect behind terminal -->
  <ellipse cx="256" cy="256" rx="250" ry="220" fill="url(#spotlight)"/>
  
  <!-- Terminal window with shadow and border -->
  <g filter="url(#shadow)">
    <rect x="45" y="85" width="422" height="342" rx="18" fill="url(#termGrad)" stroke="#00ff41" stroke-width="1" opacity="0.3"/>
    <rect x="46" y="86" width="420" height="340" rx="18" fill="url(#termGrad)"/>
  </g>
  
  <!-- Terminal header bar -->
  <rect x="46" y="86" width="420" height="48" rx="18" fill="#252530"/>
  <rect x="46" y="121" width="420" height="13" fill="#252530"/>
  
  <!-- Window control buttons with glow -->
  <g filter="url(#glow)">
    <circle cx="78" cy="110" r="10" fill="#ff5f57">
      <animate attributeName="r" values="10;11;10" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="113" cy="110" r="10" fill="#febc2e">
      <animate attributeName="r" values="10;11;10" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="110" r="10" fill="#28c840">
      <animate attributeName="r" values="10;11;10" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Button highlights -->
  <circle cx="76" cy="107" r="3.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="111" cy="107" r="3.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="146" cy="107" r="3.5" fill="#ffffff" opacity="0.6"/>
  
  <!-- Matrix rain effect -->
  <g opacity="0.3">
    <rect x="410" y="140" width="3" height="30" fill="url(#matrixGrad)">
      <animate attributeName="y" values="140;400;140" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="430" y="200" width="3" height="25" fill="url(#matrixGrad)">
      <animate attributeName="y" values="200;410;200" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="75" y="180" width="3" height="20" fill="url(#matrixGrad)">
      <animate attributeName="y" values="180;400;180" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Terminal prompt with intense glow -->
  <g filter="url(#superGlow)">
    <path d="M 95 195 L 175 245 L 95 295" 
          stroke="#00ff41" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none">
      <animate attributeName="stroke-width" values="20;22;20" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Additional prompt layers for depth -->
  <path d="M 95 195 L 175 245 L 95 295" 
        stroke="#00ff41" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"
        opacity="0.3"/>
  
  <!-- Blinking cursor with super glow -->
  <g filter="url(#superGlow)">
    <rect x="195" y="273" width="100" height="20" rx="4" fill="#00ff41">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="width" values="100;105;100" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Animated code lines with typing effect -->
  <g filter="url(#glow)">
    <rect x="95" y="325" width="0" height="7" rx="3" fill="#4a9eff" opacity="0.7">
      <animate attributeName="width" values="0;160;160" dur="2s" fill="freeze"/>
    </rect>
    <rect x="265" y="325" width="0" height="7" rx="3" fill="#ff6b9d" opacity="0.7">
      <animate attributeName="width" values="0;90;90" dur="2s" begin="0.3s" fill="freeze"/>
    </rect>
    
    <rect x="95" y="350" width="0" height="7" rx="3" fill="#c792ea" opacity="0.65">
      <animate attributeName="width" values="0;110;110" dur="2s" begin="0.6s" fill="freeze"/>
    </rect>
    <rect x="215" y="350" width="0" height="7" rx="3" fill="#82aaff" opacity="0.65">
      <animate attributeName="width" values="0;170;170" dur="2s" begin="0.9s" fill="freeze"/>
    </rect>
    
    <rect x="95" y="375" width="0" height="7" rx="3" fill="#89ddff" opacity="0.6">
      <animate attributeName="width" values="0;200;200" dur="2s" begin="1.2s" fill="freeze"/>
    </rect>
    
    <rect x="95" y="400" width="0" height="7" rx="3" fill="#ffcb6b" opacity="0.55">
      <animate attributeName="width" values="0;130;130" dur="2s" begin="1.5s" fill="freeze"/>
    </rect>
  </g>
  
  <!-- Scanline effect -->
  <rect x="46" y="86" width="420" height="4" rx="2" fill="#00ff41" opacity="0.08">
    <animate attributeName="y" values="86;426;86" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Screen glare -->
  <ellipse cx="256" cy="140" rx="200" ry="50" fill="#ffffff" opacity="0.04"/>
  
  <!-- Border pulse -->
  <rect x="45" y="85" width="422" height="342" rx="18" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Corner accents -->
  <path d="M 65 105 L 65 95 L 75 95" stroke="#00ff41" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M 447 105 L 447 95 L 437 95" stroke="#00ff41" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M 65 407 L 65 417 L 75 417" stroke="#00ff41" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M 447 407 L 447 417 L 437 417" stroke="#00ff41" stroke-width="2" opacity="0.6" fill="none"/>
</svg>
